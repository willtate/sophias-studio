<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Color Studio">
  <meta name="theme-color" content="#FBF7F0">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
  <title>Color Studio</title>
</head>
<body>
  <!-- Pick a page -->
  <main id="home">
    <h1 class="title"><span>C</span><span>o</span><span>l</span><span>o</span><span>r</span>&nbsp;<span>S</span><span>t</span><span>u</span><span>d</span><span>i</span><span>o</span></h1>
    <div id="grid" class="grid"></div>
  </main>

  <!-- Colour a page -->
  <main id="studio" hidden>
    <div class="corner left">
      <button id="homeBtn" class="quiet" aria-label="Back to pictures">
        <svg viewBox="0 0 48 48"><path d="M10 22 L24 10 L38 22 V38 H28 V29 H20 V38 H10 Z"/></svg>
      </button>
      <button id="undo" class="quiet" aria-label="Undo" disabled>
        <svg viewBox="0 0 48 48"><path d="M19 11 L8 20 L19 29 V23 C28 22 35 26 39 37 C39 24 31 16 19 16 Z"/></svg>
      </button>
    </div>
    <div class="corner right">
      <button id="clear" class="quiet clear" aria-label="Hold to start over">
        <svg viewBox="0 0 48 48"><path d="M14 16 H34 L32 39 H16 Z M11 11 H37 V15 H11 Z M20 7 H28 V11 H20 Z"/></svg>
        <span class="ring"></span>
      </button>
      <button id="save" class="quiet save" aria-label="Save to Photos">
        <svg viewBox="0 0 48 48"><path d="M8 16 H16 L19.5 11 H28.5 L32 16 H40 V37 H8 Z"/><circle cx="24" cy="26" r="6.5" fill="#FBF7F0"/></svg>
      </button>
    </div>

    <!-- One icon family: 64x64, same 30° angle, 3px ink outline, flat fills, colour-tinted tips -->
    <nav class="tools" aria-label="Tools">
      <button class="tool" data-tool="pencil" aria-label="Pencil">
        <svg viewBox="0 0 64 64"><g stroke="#34405A" stroke-width="3" stroke-linejoin="round">
          <path d="M44 6 L54 16 L22 48 L12 38 Z" fill="#F4E6C8"/>
          <path d="M12 38 L22 48 L9 52 Z" fill="#E9C9A0"/>
          <path class="tipc" d="M9 52 L12.6 46.8 L14.4 50.8 Z"/>
          <path class="tipc" d="M44 6 L54 16 L50 20 L40 10 Z"/>
        </g></svg>
        <span class="size"><i></i><i></i><i></i></span>
      </button>
      <button class="tool" data-tool="crayon" aria-label="Crayon">
        <svg viewBox="0 0 64 64"><g stroke="#34405A" stroke-width="3" stroke-linejoin="round">
          <path class="tipc" d="M40 8 L56 24 L26 54 L10 38 Z"/>
          <path d="M33 15 L49 31 M27 21 L43 37" stroke="#fff" stroke-opacity=".7"/>
          <path class="tipc" d="M10 38 L26 54 L8 58 Z"/>
        </g></svg>
        <span class="size"><i></i><i></i><i></i></span>
      </button>
      <button class="tool" data-tool="marker" aria-label="Marker">
        <svg viewBox="0 0 64 64"><g stroke="#34405A" stroke-width="3" stroke-linejoin="round">
          <path d="M38 10 L54 26 L28 52 L12 36 Z" fill="#FFFFFF"/>
          <path class="tipc" d="M38 10 L46 2 L62 18 L54 26 Z"/>
          <path d="M12 36 L28 52 L20 56 L8 44 Z" fill="#E6E1D8"/>
          <path class="tipc" d="M8 44 L20 56 L4 60 Z"/>
        </g></svg>
        <span class="size"><i></i><i></i><i></i></span>
      </button>
      <button class="tool" data-tool="spray" aria-label="Spray paint">
        <svg viewBox="0 0 64 64"><g stroke="#34405A" stroke-width="3" stroke-linejoin="round">
          <rect x="28" y="20" width="24" height="38" rx="6" fill="#FFFFFF"/>
          <rect class="tipc" x="28" y="32" width="24" height="14"/>
          <rect x="34" y="11" width="12" height="9" rx="2" fill="#E6E1D8"/>
        </g><g class="tipc"><circle cx="20" cy="13" r="3"/><circle cx="12" cy="19" r="3"/><circle cx="21" cy="23" r="2.4"/><circle cx="9" cy="9" r="2.4"/><circle cx="15" cy="5" r="2"/><circle cx="6" cy="25" r="2"/></g></svg>
        <span class="size"><i></i><i></i><i></i></span>
      </button>
      <button class="tool" data-tool="bucket" aria-label="Paint bucket">
        <svg viewBox="0 0 64 64"><g stroke="#34405A" stroke-width="3" stroke-linejoin="round">
          <path d="M18 24 L38 8 L56 30 L34 48 Z" fill="#FFFFFF"/>
          <path class="tipc" d="M18 24 L56 30 L34 48 Z"/>
          <path class="tipc" d="M18 24 C12 34 6 46 11 52 C16 58 23 50 18 40 Z"/>
        </g></svg>
      </button>
      <button class="tool" data-tool="stamp" aria-label="Stamps">
        <span class="stamp-shape"></span>
      </button>
      <button class="tool" data-tool="eraser" aria-label="Eraser">
        <svg viewBox="0 0 64 64"><g stroke="#34405A" stroke-width="3" stroke-linejoin="round">
          <path d="M34 10 L56 32 L36 52 L14 30 Z" fill="#F28CB8"/>
          <path d="M14 30 L36 52 L28 58 L6 38 Z" fill="#FFFFFF"/>
        </g></svg>
        <span class="size"><i></i><i></i><i></i></span>
      </button>
    </nav>

    <section id="stage" class="stage">
      <div id="board" class="board">
        <canvas id="paint"></canvas>
        <img id="lines" alt="">
        <div id="flash" class="flash"></div>
      </div>
    </section>

    <aside class="palette" aria-label="Colours"><div id="swatches"></div></aside>
  </main>

  <script src="js/pages.js"></script>
  <script src="js/fill.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
