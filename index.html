<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sophia&#39;s Studio">
  <meta name="theme-color" content="#FBF7F0">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
  <title>Sophia&#39;s Studio</title>
</head>
<body>
  <!-- Pick a page -->
  <main id="home">
    <header class="home-head">
      <button id="back" class="back" aria-label="Back to groups" hidden>
        <svg viewBox="0 0 48 48"><path d="M30 10 L16 24 L30 38" fill="none" stroke="#34405A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 class="title"><span>S</span><span>o</span><span>p</span><span>h</span><span>i</span><span>a</span><span>'</span><span>s</span>&nbsp;<span>S</span><span>t</span><span>u</span><span>d</span><span>i</span><span>o</span></h1>
      <h1 id="catName" class="cat-name"></h1>
    </header>
    <div id="grid" class="grid"></div>
  </main>

  <!-- Colour a page -->
  <main id="studio" hidden>
    <div class="corner left">
      <button id="homeBtn" class="round" aria-label="Back to pictures">
        <svg viewBox="0 0 48 48"><path d="M10 22 L24 10 L38 22 V38 H28 V29 H20 V38 H10 Z"/></svg>
      </button>
    </div>
    <div class="corner right">
      <button id="save" class="round save" aria-label="Hold to save to Photos">
        <svg viewBox="0 0 48 48"><path d="M8 16 H16 L19.5 11 H28.5 L32 16 H40 V37 H8 Z"/><circle cx="24" cy="26" r="6.5" fill="#34405A"/></svg>
        <span class="ring"></span>
      </button>
    </div>

    <div class="topbar">
      <button id="undo" class="round small" aria-label="Undo" disabled>
        <svg viewBox="0 0 48 48"><path d="M19 11 L8 20 L19 29 V23 C28 22 35 26 39 37 C39 24 31 16 19 16 Z"/></svg>
      </button>
      <button id="redo" class="round small" aria-label="Redo" disabled>
        <svg viewBox="0 0 48 48" style="transform:scaleX(-1)"><path d="M19 11 L8 20 L19 29 V23 C28 22 35 26 39 37 C39 24 31 16 19 16 Z"/></svg>
      </button>
      <span class="gap"></span>
      <button id="mirror" class="round small mirror" aria-label="Mirror drawing" data-mode="0">
        <svg viewBox="0 0 48 48"><path class="w1" d="M23 24 C14 8 4 10 6 20 C7 26 14 27 23 26 C14 30 10 38 15 41 C19 43 22 36 23 28 Z"/><path class="w2" d="M25 24 C34 8 44 10 42 20 C41 26 34 27 25 26 C34 30 38 38 33 41 C29 43 26 36 25 28 Z"/><path d="M24 8 V44" stroke="#34405A" stroke-width="2" stroke-dasharray="3 3"/></svg>
        <b class="badge"></b>
      </button>
      <button id="replay" class="round small" aria-label="Watch it again" disabled>
        <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="17" fill="none" stroke="#34405A" stroke-width="4"/><path d="M20 15 L33 24 L20 33 Z"/></svg>
      </button>
    </div>

    <!-- One icon family: 64x64, same 30° angle, 3px ink outline, flat fills, colour-tinted tips -->
    <nav class="tools" aria-label="Tools">
      <button class="tool" data-tool="pencil" aria-label="Pencil">
        <svg viewBox="0 0 64 64"><g stroke="#34405A" stroke-width="3" stroke-linejoin="round">
          <path d="M44 6 L54 16 L22 48 L12 38 Z" fill="#F4E6C8"/>
          <path d="M12 38 L22 48 L9 52 Z" fill="#E9C9A0"/>
          <path class="tipc" d="M9 52 L12.6 46.8 L14.4 50.8 Z"/>
          <path class="tipc" d="M44 6 L54 16 L50 20 L40 10 Z"/>
        </g></svg>
        <span class="size"><i></i><i></i><i></i></span>
      </button>
      <button class="tool" data-tool="crayon" aria-label="Crayon">
        <svg viewBox="0 0 64 64"><g stroke="#34405A" stroke-width="3" stroke-linejoin="round">
          <path class="tipc" d="M40 8 L56 24 L26 54 L10 38 Z"/>
          <path d="M33 15 L49 31 M27 21 L43 37" stroke="#fff" stroke-opacity=".7"/>
          <path class="tipc" d="M10 38 L26 54 L8 58 Z"/>
        </g></svg>
        <span class="size"><i></i><i></i><i></i></span>
      </button>
      <button class="tool" data-tool="marker" aria-label="Marker">
        <svg viewBox="0 0 64 64"><g stroke="#34405A" stroke-width="3" stroke-linejoin="round">
          <path d="M38 10 L54 26 L28 52 L12 36 Z" fill="#FFFFFF"/>
          <path class="tipc" d="M38 10 L46 2 L62 18 L54 26 Z"/>
          <path d="M12 36 L28 52 L20 56 L8 44 Z" fill="#E6E1D8"/>
          <path class="tipc" d="M8 44 L20 56 L4 60 Z"/>
        </g></svg>
        <span class="size"><i></i><i></i><i></i></span>
      </button>
      <button class="tool" data-tool="glitter" aria-label="Glitter pen">
        <svg viewBox="0 0 64 64"><g stroke="#34405A" stroke-width="3" stroke-linejoin="round">
          <path d="M40 12 L52 24 L26 50 L14 38 Z" fill="#FFFFFF"/>
          <path class="tipc" d="M14 38 L26 50 L10 56 Z"/>
          <path class="tipc" d="M40 12 L46 6 L58 18 L52 24 Z"/>
        </g>
        <path class="tipc" d="M16 6 L18 12 L24 14 L18 16 L16 22 L14 16 L8 14 L14 12 Z"/>
        <path fill="#F9D648" stroke="#34405A" stroke-width="1.5" d="M50 38 L51.6 42.4 L56 44 L51.6 45.6 L50 50 L48.4 45.6 L44 44 L48.4 42.4 Z"/>
        <circle cx="30" cy="10" r="2.2" fill="#F9D648"/><circle cx="58" cy="32" r="2" class="tipc"/></svg>
        <span class="size"><i></i><i></i><i></i></span>
      </button>
      <button class="tool" data-tool="neon" aria-label="Neon pen">
        <svg viewBox="0 0 64 64"><circle class="tipc" cx="14" cy="50" r="13" opacity=".28"/><circle class="tipc" cx="14" cy="50" r="8" opacity=".35"/>
        <g stroke="#34405A" stroke-width="3" stroke-linejoin="round">
          <path d="M42 8 L56 22 L28 50 L14 36 Z" fill="#34405A"/>
          <path class="tipc" d="M42 8 L48 2 L62 16 L56 22 Z"/>
          <path class="tipc" d="M14 36 L28 50 L12 54 Z"/>
        </g><path d="M36 20 L44 28" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6"/></svg>
        <span class="size"><i></i><i></i><i></i></span>
      </button>
      <button class="tool" data-tool="spray" aria-label="Spray paint">
        <svg viewBox="0 0 64 64"><g stroke="#34405A" stroke-width="3" stroke-linejoin="round">
          <rect x="28" y="20" width="24" height="38" rx="6" fill="#FFFFFF"/>
          <rect class="tipc" x="28" y="32" width="24" height="14"/>
          <rect x="34" y="11" width="12" height="9" rx="2" fill="#E6E1D8"/>
        </g><g class="tipc"><circle cx="20" cy="13" r="3"/><circle cx="12" cy="19" r="3"/><circle cx="21" cy="23" r="2.4"/><circle cx="9" cy="9" r="2.4"/><circle cx="15" cy="5" r="2"/><circle cx="6" cy="25" r="2"/></g></svg>
        <span class="size"><i></i><i></i><i></i></span>
      </button>
      <button class="tool" data-tool="bucket" aria-label="Paint bucket">
        <svg viewBox="0 0 64 64"><g stroke="#34405A" stroke-width="3" stroke-linejoin="round">
          <path d="M18 24 L38 8 L56 30 L34 48 Z" fill="#FFFFFF"/>
          <path class="tipc" d="M18 24 L56 30 L34 48 Z"/>
          <path class="tipc" d="M18 24 C12 34 6 46 11 52 C16 58 23 50 18 40 Z"/>
        </g></svg>
      </button>
      <button class="tool" data-tool="stamp" aria-label="Stamps">
        <span class="stamp-shape"></span>
      </button>
      <button class="tool" data-tool="sticker" aria-label="Stickers">
        <svg viewBox="0 0 64 64"><g stroke="#34405A" stroke-width="3" stroke-linejoin="round">
          <path d="M10 14 Q10 8 16 8 H48 Q54 8 54 14 V40 L38 56 H16 Q10 56 10 50 Z" fill="#FFFFFF"/>
          <path d="M54 40 L40 40 Q38 40 38 42 V56 Z" fill="#E6E1D8"/>
        </g></svg>
        <span class="sticker-face"></span>
      </button>
      <button class="tool" data-tool="text" aria-label="Letters">
        <svg viewBox="0 0 64 64"><text x="4" y="48" font-size="44" font-weight="800" fill="#34405A" font-family="ui-rounded, -apple-system, sans-serif">A</text><text class="tipc" x="34" y="50" font-size="34" font-weight="800" font-family="ui-rounded, -apple-system, sans-serif">a</text></svg>
        <span class="size"><i></i><i></i><i></i></span>
      </button>
      <button class="tool" data-tool="eraser" aria-label="Eraser">
        <svg viewBox="0 0 64 64"><g stroke="#34405A" stroke-width="3" stroke-linejoin="round">
          <path d="M34 10 L56 32 L36 52 L14 30 Z" fill="#F28CB8"/>
          <path d="M14 30 L36 52 L28 58 L6 38 Z" fill="#FFFFFF"/>
        </g></svg>
        <span class="size"><i></i><i></i><i></i></span>
      </button>
    </nav>

    <section id="stage" class="stage">
      <div id="board" class="board">
        <canvas id="paint"></canvas>
        <img id="lines" alt="">
        <div id="guides" class="guides" hidden><i class="v"></i><i class="h"></i></div>
        <div id="objects" class="objects"></div>
        <div id="flash" class="flash"></div>
      </div>
    </section>

    <aside class="palette" aria-label="Colours">
      <div id="swatches"></div>
      <button id="clear" class="round clear" aria-label="Hold to start over">
        <svg viewBox="0 0 48 48"><path d="M14 16 H34 L32 39 H16 Z M11 11 H37 V15 H11 Z M20 7 H28 V11 H20 Z"/></svg>
        <span class="ring"></span>
      </button>
    </aside>

    <!-- Letters keyboard (text tool): ABC order, big keys, speaks what she types -->
    <div id="kbd" class="kbd" hidden>
      <div class="kbd-keys"></div>
      <div class="kbd-row bottom">
        <button class="key wide" data-act="case" aria-label="Small or big letters">abc</button>
        <button class="key wide" data-act="nums" aria-label="Numbers">123</button>
        <button class="key style" data-act="solid" aria-label="Coloured letters"><b>A</b></button>
        <button class="key style" data-act="hollow" aria-label="Letters to colour in"><b class="hollow">A</b></button>
        <button class="key space" data-act="space" aria-label="Space"></button>
        <button class="key wide" data-act="back" aria-label="Delete">
          <svg viewBox="0 0 48 48"><path d="M18 12 H40 V36 H18 L6 24 Z" fill="none" stroke="#34405A" stroke-width="4" stroke-linejoin="round"/><path d="M23 18 L33 30 M33 18 L23 30" stroke="#34405A" stroke-width="4" stroke-linecap="round"/></svg>
        </button>
        <button class="key wide" data-act="say" aria-label="Read it to me">
          <svg viewBox="0 0 48 48"><path d="M8 18 H16 L26 9 V39 L16 30 H8 Z" fill="#34405A"/><path d="M32 17 C36 21 36 27 32 31 M37 12 C44 19 44 29 37 36" fill="none" stroke="#34405A" stroke-width="4" stroke-linecap="round"/></svg>
        </button>
        <button class="key done" data-act="done" aria-label="Done">
          <svg viewBox="0 0 48 48"><path d="M10 25 L20 35 L39 13" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <div id="replayBar" class="replay-bar" hidden>
      <button id="replayStop" class="round" aria-label="Stop">
        <svg viewBox="0 0 48 48"><rect x="14" y="14" width="20" height="20" rx="4"/></svg>
      </button>
    </div>
    <div id="sizeBubble" class="size-bubble" hidden><i></i></div>
  </main>

  <input id="photoInput" type="file" accept="image/*" hidden>
  <div id="busy" class="busy" hidden><div class="spinner"></div><p>Making your page...</p></div>

  <script src="js/art-kit.js"></script>
  <script src="js/pages/animals.js"></script>
  <script src="js/pages/fairy.js"></script>
  <script src="js/pages/vehicles.js"></script>
  <script src="js/pages/robots.js"></script>
  <script src="js/pages/space.js"></script>
  <script src="js/pages/monsters.js"></script>
  <script src="js/pages/sea.js"></script>
  <script src="js/pages/garden.js"></script>
  <script src="js/pages/treats.js"></script>
  <script src="js/pages/starter.js"></script>
  <script>Art.finalize();</script>
  <script src="js/fill.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/photo.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
